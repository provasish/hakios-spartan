# devices/spartan/soc/soc.conf: what this SoC layer is: the facts of a Qualcomm SM8250-family chip, whatever phone it is in.
# A phone with this SoC includes configs/sm8250.config from its defconfig. docs/porting/repositories.md has every word.

soc sm8250
	title       Qualcomm SM8250 family (SM8250 "Snapdragon 865", SM8250-AC "Snapdragon 870"; "kona")
	vendor      Qualcomm
	cores       8, the biggest is core 7
	gpu         Adreno 650
	maintainer  provasish (README.md)
