# devices/spartan/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md
# has every word.

device spartan
	title       realme GT Neo 3T
	vendor      realme
	soc         sm8250
	defconfig   spartan_defconfig
	maintainer  provasish (README.md)
	status      display     works     the panel through U-Boot's framebuffer (0x9C000000, 1080 x 2400); Darwin's home screen drawn in software
	status      touch       works     FocalTech FT3658U on I2C, serial engine 13 (CONFIG_HAKIOS_FT3658U, ft3658u=1): SpringBoard and Settings used by touch
	status      buttons     missing   power on the PM8150's PON, volume up PM8150 GPIO 6, volume down the PON's RESIN: no driver yet
	status      cpu         partial   8 cores registered, the boot core and the four A77s online (cpus=8); the A55s 1-3 not started
	status      gpu         missing   Adreno 650: no driver yet, the screen is drawn in software
	status      storage     missing   UFS: U-Boot reads it; no driver in the kernel yet
	status      audio       missing
	status      battery     missing
	status      wifi        missing   QCA6390 on PCIe
	status      bluetooth   missing
	status      cellular    missing   the X55 modem on PCIe
